pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.{ts,json,mjs}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    test:
      run: pnpm test
    knip:
      run: pnpm knip
    slop:
      run: pnpm lint:slop
